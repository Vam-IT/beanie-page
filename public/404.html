<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>CupTrail - Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    
    // Set to 0 for custom domains (beanie-app.com), 1 for GitHub project pages (username.github.io/repo)
    var pathSegmentsToKeep = window.location.hostname.endsWith('github.io') ? 1 : 0;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <noscript>
    <p>CupTrail requires JavaScript to run. Please enable JavaScript in your browser.</p>
  </noscript>
</body>
</html>
